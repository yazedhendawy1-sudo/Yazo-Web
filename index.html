--red:#ff1744;

--bg:#eef4fb;
--card:#fff;
--card2:#f5f8fc;
--text:#111827;
--muted:#53657a;
--border:#c9d7e8;

body{

background:

radial-gradient(circle at 90% 0%,#65091d,transparent 35%),
var(--bg);

transition:.3s;
}

body.light{
background:
radial-gradient(circle at 10% 0%,#cce8ff,transparent 35%),
radial-gradient(circle at 90% 0%,#ffd5df,transparent 35%),

/* =========================
   YAZO HEADER
========================= */

header{
text-align:center;
padding:25px 15px 15px;
}

.yazo-logo{
font-size:75px;
font-weight:900;
letter-spacing:-6px;
line-height:1;
}

.y-blue{
color:#008cff;

0 0 25px #008cff;
}

.y-red{
color:#ff1744;
text-shadow:
0 0 8px #ff1744,
0 0 25px #ff1744;
}

.description{
margin-top:10px;
color:var(--muted);
}

/* =========================
   TOP BUTTONS
========================= */

.top-buttons{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:10px 15px 15px;
}

.top-button{
border:1px solid var(--border);
border-radius:20px;
padding:10px 16px;
background:var(--card);
color:var(--text);
cursor:pointer;
transition:.2s;
}

.top-button:hover,
.top-button.active{
background:var(--blue);
color:white;
border-color:var(--blue);
transform:translateY(-2px);
}

/* =========================
   SEARCH
========================= */

.search-box{
width:90%;
max-width:900px;
margin:auto;
}

#search{
width:100%;
padding:17px 25px;
border:2px solid var(--blue);
border-radius:35px;
outline:none;
background:var(--input);
color:var(--text);
font-size:18px;
}

#search::placeholder{
color:var(--muted);
}

/* =========================
   CATEGORIES
========================= */

.categories{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
padding:20px;
}

.category{
padding:10px 17px;
border:1px solid var(--border);
border-radius:20px;
background:var(--card);
color:var(--text);
cursor:pointer;
transition:.2s;
}

.category:hover,
.category.active{
background:var(--blue);
color:white;
border-color:var(--blue);
}

/* =========================
   COUNTER
========================= */

#counter{
text-align:center;
color:var(--muted);
margin:5px 0 20px;
}

/* =========================
   SITES
========================= */

#sites{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:18px;
}

.site{
position:relative;
min-height:170px;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

overflow:hidden;

border:1px solid var(--border);
border-radius:20px;

background:
linear-gradient(
145deg,
var(--card),
var(--card2)
);

text-decoration:none;
transition:.25s;
}

.site:hover{
transform:translateY(-7px) scale(1.02);
border-color:var(--blue);
box-shadow:0 0 25px var(--shadow);
}

.site img{
width:65px;
height:65px;
margin-bottom:12px;
padding:5px;
object-fit:contain;
border-radius:14px;
background:white;
}

.site-name{
max-width:90%;
overflow:hidden;
color:var(--text);
text-overflow:ellipsis;
white-space:nowrap;
}

.site-category{
margin-top:6px;
font-size:11px;
color:var(--muted);
}

   FAVORITE
========================= */

.favorite{
position:absolute;
top:7px;
left:7px;
z-index:5;

border:none;
background:none;

color:#777;
font-size:22px;
cursor:pointer;
}

.favorite.active{
color:gold;
text-shadow:0 0 10px gold;
}

/* =========================
   HIDE
========================= */

.hide-site{
position:absolute;
top:8px;
right:8px;
z-index:5;

border:none;
background:#0006;
color:#aaa;

width:28px;
height:28px;

border-radius:50%;
cursor:pointer;
}

.hide-site:hover{

========================= */

bottom:25px;
z-index:20;

width:60px;
height:60px;

border:none;
border-radius:50%;

color:white;
cursor:pointer;

135deg,
#008cff,
#ff1744

.modal{
display:none;

position:fixed;
inset:0;

z-index:100;

align-items:center;
justify-content:center;

padding:20px;

background:#0009;

backdrop-filter:blur(8px);
}

.modal.show{
display:flex;

padding:30px;

border:1px solid var(--blue);
border-radius:25px;

background:
linear-gradient(
145deg,
var(--card),
var(--card2)
);

box-shadow:0 0 40px var(--shadow);

animation:popup .2s ease;

opacity:0;
transform:scale(.8);

to{

transform:scale(1);
}

padding:15px;

border:1px solid var(--border);
border-radius:12px;

outline:none;

background:var(--input);
color:var(--text);

font-size:16px;

.modal-box select:focus{

linear-gradient(
135deg,
#008cff,
#ff1744

font-size:17px;

.close{

left:15px;

border:none;
background:none;

color:#aaa;

font-size:30px;
cursor:pointer;
}

games:"🎮 الألعاب",
video:"🎬 الفيديو",
education:"📚 التعليم",
social:"👥 التواصل",
ai:"🤖 الذكاء الاصطناعي",
tools:"🛠️ الأدوات",
programming:"💻 البرمجة",
music:"🎵 الموسيقى",
news:"📰 الأخبار"

};

return names[category]||"🌐 عام";

}

/* =========================
   GENERATED LOGO
========================= */

function generatedLogo(site){

const colors={

games:["#ff1744","#ff7b00"],
video:["#ff1744","#ff4081"],
education:["#008cff","#00d4ff"],
social:["#008cff","#7c4dff"],
ai:["#7c4dff","#ff1744"],
tools:["#00bcd4","#008cff"],
programming:["#008cff","#00e676"],
music:["#ff1744","#9c27b0"],
news:["#ff9800","#ff1744"]

};

const c=
colors[site.category]||
["#008cff","#ff1744"];

const svg=`

<svg
xmlns="http://www.w3.org/2000/svg"
width="128"
height="128"
>

<defs>

<linearGradient id="g">

<stop stop-color="${c[0]}"/>

<stop
offset="1"
stop-color="${c[1]}"
/>

</linearGradient>

</defs>

<rect
width="128"
height="128"
rx="28"
fill="#0d1627"
/>

<rect
x="5"
y="5"
width="118"
height="118"
rx="24"
fill="url(#g)"
opacity=".25"
/>

<text
x="64"
y="82"
text-anchor="middle"
font-family="Arial"
font-size="50"
>
${site.icon||"🌐"}
</text>

<circle
cx="103"
cy="25"
r="7"
fill="${c[1]}"
/>

</svg>

`;

return "data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(svg);

}

/* =========================
   GET LOGO
========================= */

function getLogo(site){

if(site.generated){

return generatedLogo(site);

}

try{

const domain=
new URL(site.url).hostname;

return "https://www.google.com/s2/favicons?domain="+
domain+
"&sz=128";

}catch{

return generatedLogo({

category:site.category,
icon:"🌐"

});

}

}

/* =========================
   RENDER
========================= */

function render(){

sitesBox.innerHTML="";

const text=
search.value
.toLowerCase()
.trim();

let filtered=
sites.filter(site=>{

if(!showHidden &&
hiddenSites.includes(site.url)){

return false;

}

if(showHidden &&
!hiddenSites.includes(site.url)){

return false;

}

if(
showFavorites &&
!favorites.includes(site.url)
){

return false;

}

const searchMatch=
site.name
.toLowerCase()
.includes(text);

const categoryMatch=
currentCategory==="all"||
site.category===currentCategory;

return searchMatch&&categoryMatch;

});

counter.textContent=
"🔎 عرض "+
filtered.length+
" من "+
sites.length+
" موقع / برنامج";

empty.style.display=
filtered.length?"none":"block";

filtered
.slice(0,300)
.forEach(site=>{

const card=
document.createElement("a");

card.className="site";

card.href=site.url;

card.target="_blank";

card.rel="noopener noreferrer";

/* FAVORITE */

const star=
document.createElement("button");

star.className="favorite";

const isFavorite=
favorites.includes(site.url);

star.textContent=
isFavorite?"★":"☆";

if(isFavorite){

star.classList.add("active");

}

star.onclick=function(e){

e.preventDefault();
e.stopPropagation();

if(favorites.includes(site.url)){

favorites=
favorites.filter(
x=>x!==site.url
);

}else{

favorites.push(site.url);

}

localStorage.setItem(
"yazoFavorites",
JSON.stringify(favorites)
);

render();

};

/* HIDE */

const hide=
document.createElement("button");

hide.className="hide-site";

hide.textContent="×";

hide.title="إخفاء";

hide.onclick=function(e){

e.preventDefault();
e.stopPropagation();

if(!hiddenSites.includes(site.url)){

hiddenSites.push(site.url);

}

localStorage.setItem(
"yazoHidden",
JSON.stringify(hiddenSites)
);

render();

};

/* IMAGE */

const img=
document.createElement("img");

img.src=getLogo(site);

img.alt=site.name;

img.onerror=function(){

this.onerror=null;

this.src=
generatedLogo({

category:site.category,

icon:
site.icon||"🌐"

});

};

/* NAME */

const name=
document.createElement("span");

name.className="site-name";

name.textContent=site.name;

/* CATEGORY */

const cat=
document.createElement("span");

cat.className="site-category";

cat.textContent=
categoryName(site.category);

card.appendChild(star);

card.appendChild(hide);

card.appendChild(img);

card.appendChild(name);

card.appendChild(cat);

sitesBox.appendChild(card);

});

restoreButton.classList.toggle(
"show",
hiddenSites.length>0
);

}

/* =========================
   SEARCH
========================= */

search.addEventListener(
"input",
render
);

/* =========================
   CATEGORIES
========================= */

document
.querySelectorAll(".category")
.forEach(button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".category")
.forEach(x=>
x.classList.remove("active")
);

this.classList.add("active");

currentCategory=
this.dataset.category;

render();

}
);

});

/* =========================
   THEME
========================= */

themeButton.onclick=function(){

if(
document.body.classList.contains("light")
){

document.body.classList.remove("light");

theme="dark";

themeButton.textContent=
"🌙 الثيم";

}else{

document.body.classList.add("light");

theme="light";

themeButton.textContent=
"☀️ الثيم";

}

localStorage.setItem(
"yazoTheme",
theme
);

};

/* =========================
   FAVORITES
========================= */

favoriteButton.onclick=function(){

showFavorites=!showFavorites;

showHidden=false;

favoriteButton.classList.toggle(
"active",
showFavorites
);

hiddenButton.classList.remove(
"active"
);

search.value="";

render();

};

/* =========================
   HIDDEN
========================= */

hiddenButton.onclick=function(){

showHidden=!showHidden;

showFavorites=false;

hiddenButton.classList.toggle(
"active",
showHidden
);

favoriteButton.classList.remove(
"active"
);

search.value="";

render();

};

/* =========================
   RESTORE
========================= */

restoreButton.onclick=function(){

hiddenSites=[];

localStorage.setItem(
"yazoHidden",
"[]"
);

showHidden=false;

hiddenButton.classList.remove(
"active"
);

render();

};

/* =========================
   ADD MODAL
========================= */

addButton.onclick=function(){

addModal.classList.add("show");

siteName.focus();

message.textContent="";

};

closeModal.onclick=function(){

addModal.classList.remove("show");

siteName.value="";

siteUrl.value="";

siteCategory.value="tools";

message.textContent="";

};

addModal.onclick=function(e){

if(e.target===addModal){

addModal.classList.remove("show");

siteName.value="";

siteUrl.value="";

siteCategory.value="tools";

message.textContent="";

}

};

/* =========================
   SAVE SITE
========================= */

saveSite.onclick=function(){

const name=
siteName.value.trim();

let url=
siteUrl.value.trim();

const category=
siteCategory.value;

if(!name||!url){

message.textContent=
"⚠️ اكتب اسم الموقع والرابط";

message.className=
"message error";

return;

}

if(
!url.startsWith("http://")&&
!url.startsWith("https://")
){

url="https://"+url;

}

const newSite={

name:name,
url:url,
category:category,
generated:false

};

sites.push(newSite);

const saved=
JSON.parse(
localStorage.getItem("yazoSites")||"[]"
);

saved.push(newSite);

localStorage.setItem(
"yazoSites",
JSON.stringify(saved)
);

message.textContent=
"✅ تم إضافة الموقع بنجاح";

message.className=
"message success";

siteName.value="";

siteUrl.value="";

render();

setTimeout(()=>{

addModal.classList.remove("show");

message.textContent="";

},800);

};

/* =========================
   RANDOM
========================= */

document
.getElementById("randomButton")
.onclick=function(){

const list=
sites.filter(site=>

!hiddenSites.includes(site.url)&&

(
currentCategory==="all"||
site.category===currentCategory
)

);

if(!list.length){

return;

}

const random=
list[
Math.floor(
Math.random()*list.length
)
];

window.open(
random.url,
"_blank"
);

};

/* =========================
   WELCOME SYSTEM
========================= */

const welcomeModal=
document.getElementById(
"welcomeModal"
);

const newUserBtn=
document.getElementById(
"newUserBtn"
);

const oldUserBtn=
document.getElementById(
"oldUserBtn"
);

const yazoWelcomeDone=
localStorage.getItem(
"yazoWelcomeDone"
);

/*
  لو المستخدم أول مرة يدخل
  تظهر له نافذة الترحيب
*/

if(!yazoWelcomeDone){

welcomeModal.classList.add(
"show"
);

}

/*
  المستخدم قال: أنا جديد
*/

newUserBtn.onclick=function(){

localStorage.setItem(
"yazoWelcomeDone",
"true"
);

welcomeModal.classList.remove(
"show"
);

};

/*
  المستخدم جرب Yazo قبل كده
*/

oldUserBtn.onclick=function(){

localStorage.setItem(
"yazoWelcomeDone",
"true"
);

welcomeModal.classList.remove(
"show"
);

};

/* =========================
   START
========================= */

render();

</script>
<!-- YAZO VIDEO -->
<section style="
max-width:1000px;
margin:50px auto;
padding:25px;
background:#080e19;
border:1px solid #243653;
border-radius:25px;
color:white;
text-align:center;
">

<h2>🎬 فيديو Yazo Web</h2>

<div id="yazoVideo" style="
width:100%;
aspect-ratio:16/9;
background:#02050b;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
overflow:hidden;
">

<div id="videoIcon" style="font-size:80px">🚀</div>

<h1 id="videoTitle">Yazo Web</h1>

<p id="videoText">كل مواقعك وبرامجك في مكان واحد</p>

</div>

<div style="
height:7px;
background:#17233d;
border-radius:10px;
margin:15px 0;
overflow:hidden;
">

<div id="videoProgress" style="
width:0%;
height:100%;
background:#008cff;
transition:.3s;
"></div>

</div>

<button id="startYazoVideo" style="
padding:14px 25px;
border:0;
border-radius:12px;
background:#008cff;
color:white;
font-size:17px;
cursor:pointer;
">
🎬 تشغيل الفيديو
</button>

</section>

<script>

const yazoScenes = [

["🚀","Yazo Web","كل مواقعك وبرامجك في مكان واحد"],

["🔎","البحث السريع","ابحث عن أي موقع بسهولة"],

["🎮","الألعاب","اكتشف مواقع الألعاب"],

["🎬","الفيديو","شاهد مواقع الفيديو"],

["📚","التعليم","مواقع تعليمية في مكان واحد"],

["🤖","الذكاء الاصطناعي","اكتشف أدوات AI"],

["💻","البرمجة","أدوات ومواقع للمبرمجين"],

["⭐","المفضلة","احفظ مواقعك المفضلة"],

["🌙","الثيم","اختر الشكل الذي يعجبك"],

["🔥","Yazo Web","جرّبه الآن!"]

];

const startYazoVideo =
document.getElementById("startYazoVideo");

const videoIcon =
document.getElementById("videoIcon");

const videoTitle =
document.getElementById("videoTitle");

const videoText =
document.getElementById("videoText");

const videoProgress =
document.getElementById("videoProgress");

startYazoVideo.onclick = function(){

let i = 0;

startYazoVideo.disabled = true;

function nextScene(){

if(i >= yazoScenes.length){

startYazoVideo.disabled = false;

videoProgress.style.width = "100%";

return;

}

videoIcon.textContent = yazoScenes[i][0];

videoTitle.textContent = yazoScenes[i][1];

videoText.textContent = yazoScenes[i][2];

videoProgress.style.width =
((i + 1) / yazoScenes.length * 100) + "%";

i++;

setTimeout(nextScene,3000);

}

nextScene();

};


</script>
